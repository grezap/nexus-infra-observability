---
# nexus_observability — role tasks
#
# Observability baseline for every non-gateway NexusPlatform VM.
#   - prometheus-node-exporter on :9100 (Phase 0.B.3; scraped by Phase 0.I Prom HA)
#   - Vector log shipper (Phase 0.I.6) -- ships journald + /var/log/* via OTLP
#     to the OTel Collector pair (otel.nexus.lab:4318/v1/logs), which then fans
#     out to Loki. Tags every line with nexus_host=<hostname>, fleet=nexusplatform.
#
# All package installation is done by the OS-specific calling role so we
# can batch apt operations (one dpkg lock acquisition per build).

# ─── prometheus-node-exporter ────────────────────────────────────────────
- name: Enable + start prometheus-node-exporter
  ansible.builtin.systemd:
    name: prometheus-node-exporter
    enabled: true
    state: started

# ─── Vector log shipper (Phase 0.I.6) ─────────────────────────────────────
# Vector is a self-contained Rust binary; install from upstream tarball.
- name: Ensure vector group
  ansible.builtin.group:
    name: vector
    system: true
    state: present

- name: Ensure vector user
  ansible.builtin.user:
    name: vector
    group: vector
    system: true
    shell: /usr/sbin/nologin
    home: /var/lib/nexus-vector
    create_home: false
    groups: systemd-journal     # read journald
    append: yes
    state: present

- name: Download Vector {{ nexus_vector_version | default('0.50.0') }} tarball
  ansible.builtin.get_url:
    url: "https://packages.timber.io/vector/{{ nexus_vector_version | default('0.50.0') }}/vector-{{ nexus_vector_version | default('0.50.0') }}-x86_64-unknown-linux-gnu.tar.gz"
    dest: "/tmp/vector-{{ nexus_vector_version | default('0.50.0') }}.tar.gz"
    mode: '0644'
    timeout: 180

- name: Create /opt/vector
  ansible.builtin.file:
    path: /opt/vector
    state: directory
    owner: vector
    group: vector
    mode: '0755'

- name: Extract Vector
  ansible.builtin.unarchive:
    src: "/tmp/vector-{{ nexus_vector_version | default('0.50.0') }}.tar.gz"
    dest: /opt/vector
    owner: vector
    group: vector
    remote_src: true
    extra_opts: ['--strip-components=2']  # vector-X.Y.Z-x86_64-.../ -> /opt/vector/
    creates: /opt/vector/bin/vector

- name: Symlink vector to /usr/local/bin
  ansible.builtin.file:
    src: /opt/vector/bin/vector
    dest: /usr/local/bin/vector
    state: link

- name: Create /etc/nexus-vector + /var/lib/nexus-vector + /var/log/nexus-vector
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: /etc/nexus-vector, owner: root, group: vector, mode: '0750' }
    - { path: /var/lib/nexus-vector, owner: vector, group: vector, mode: '0755' }
    - { path: /var/log/nexus-vector, owner: vector, group: vector, mode: '0755' }

- name: Drop baseline vector.yaml (Phase 0.I.6 canon -- journald + /var/log -> OTel Collector)
  ansible.builtin.copy:
    dest: /etc/nexus-vector/vector.yaml
    content: |
      # NexusPlatform Phase 0.I.6 fleet-wide log shipper baseline.
      # Source: journald + /var/log/*.log
      # Sink:   Loki HA pair (loki.nexus.lab:3100) -- direct Loki push.
      #         TLS verify_certificate=false (interim; see handbook §3.F T34).
      data_dir: /var/lib/nexus-vector
      sources:
        journald:
          type: journald
          current_boot_only: true
        var_logs:
          type: file
          include:
            - /var/log/syslog
            - /var/log/auth.log
            - /var/log/kern.log
            - /var/log/dpkg.log
          ignore_older_secs: 86400
      transforms:
        add_metadata:
          type: remap
          inputs: [journald, var_logs]
          source: |
            .nexus_host = get_hostname!()
            .fleet = "nexusplatform"
      sinks:
        loki_logs:
          type: loki
          inputs: [add_metadata]
          endpoint: https://loki.nexus.lab:3100
          tls:
            verify_certificate: false  # interim until obs-loki-ca cert bundle ships fleet-wide (handbook §3.F T34)
          encoding:
            codec: json
          labels:
            fleet: nexusplatform
          out_of_order_action: accept
          batch:
            max_events: 1000
            timeout_secs: 5
          request:
            retry_attempts: 3
            retry_initial_backoff_secs: 5
            retry_max_duration_secs: 60
    owner: root
    group: vector
    mode: '0640'

- name: Install nexus-vector.service systemd unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/nexus-vector.service
    content: |
      [Unit]
      Description=NexusPlatform Vector log shipper (Phase 0.I.6)
      Documentation=https://vector.dev/
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      User=vector
      Group=vector
      WorkingDirectory=/var/lib/nexus-vector
      ExecStart=/opt/vector/bin/vector --config /etc/nexus-vector/vector.yaml
      ExecReload=/bin/kill -HUP $MAINPID
      Restart=on-failure
      RestartSec=10s
      TimeoutStopSec=30s
      LimitNOFILE=65536
      NoNewPrivileges=true
      PrivateTmp=true
      ProtectHome=true
      ProtectSystem=full
      StandardOutput=append:/var/log/nexus-vector/vector.log
      StandardError=append:/var/log/nexus-vector/vector.log

      [Install]
      WantedBy=multi-user.target
    owner: root
    group: root
    mode: '0644'

- name: Reload systemd + DISABLE nexus-vector at bake (operator enables when OTel cert trust anchor is in place)
  ansible.builtin.systemd:
    name: nexus-vector.service
    enabled: false
    state: stopped
    daemon_reload: true
  failed_when: false

- name: Remove downloaded Vector tarball
  ansible.builtin.file:
    path: "/tmp/vector-{{ nexus_vector_version | default('0.50.0') }}.tar.gz"
    state: absent
