#!/usr/sbin/nft -f
#
# obs-otel-collector-node -- nftables ruleset (Phase 0.I.5 baseline; cold-clone
# safety net). The TF role-overlay-otel-nftables-backplane.tf is canonical.
#
# nic0 = VMnet11 (OTLP receivers + node_exporter + SSH from clients),
# nic1 = VMnet10 (backplane: reserved; Collectors are independent per ADR-0031).

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority 0; policy drop;

        iif "lo" accept
        ct state { established, related } accept
        ct state invalid drop
        ip protocol icmp   accept
        ip6 nexthdr icmpv6 accept

        iifname "nic0" ip saddr 192.168.70.0/24 tcp dport 22   accept comment "SSH from VMnet11"
        iifname "nic0" ip saddr 192.168.70.0/24 tcp dport 9100 accept comment "node_exporter from VMnet11"

        # Trust the VMnet10 cluster backplane (reserved).
        iifname "nic1" ip saddr 192.168.10.0/24 accept comment "trusted cluster backplane (VMnet10) -- reserved"

        # OTLP receivers from VMnet11 (gRPC :4317 + HTTP :4318).
        iifname "nic0" ip saddr 192.168.70.0/24 tcp dport { 4317, 4318 } accept comment "OTLP gRPC + HTTP receivers from VMnet11"

        counter drop
    }
    chain forward { type filter hook forward priority 0; policy drop; }
    chain output  { type filter hook output priority 0; policy accept; }
}
