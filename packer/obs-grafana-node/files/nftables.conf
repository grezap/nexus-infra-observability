#!/usr/sbin/nft -f
#
# obs-grafana-node -- nftables ruleset (Phase 0.I.4 baseline; cold-clone safety
# net). The TF role-overlay-grafana-nftables-backplane.tf is canonical.
#
# nic0 = VMnet11 (client HTTPS :3000 + VRRP between the pair),
# nic1 = VMnet10 (backplane: currently unused; reserved for future intra-Grafana
#                 coordination). Per memory/feedback_cluster_template_nftables_backplane.md
# the VMnet10 trust rule is what makes any future cluster traffic work; VRRP
# (proto 112) must be allowed on VMnet11 for the keepalived VIP failover (unicast).

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority 0; policy drop;

        iif "lo" accept
        ct state { established, related } accept
        ct state invalid drop
        ip protocol icmp   accept
        ip6 nexthdr icmpv6 accept

        iifname "nic0" ip saddr 192.168.70.0/24 tcp dport 22   accept comment "SSH from VMnet11"
        iifname "nic0" ip saddr 192.168.70.0/24 tcp dport 9100 accept comment "node_exporter from VMnet11"

        # Trust the VMnet10 cluster backplane (reserved).
        iifname "nic1" ip saddr 192.168.10.0/24 accept comment "trusted cluster backplane (VMnet10)"

        # Client access from the lab (VMnet11): Grafana HTTPS :3000 (direct or via VIP .184)
        iifname "nic0" ip saddr 192.168.70.0/24 tcp dport 3000 accept comment "Grafana HTTPS from VMnet11 (direct + VIP .184)"

        # VRRP (proto 112) for the keepalived VIP failover (unicast between the pair).
        iifname "nic0" ip saddr 192.168.70.0/24 ip protocol vrrp accept comment "keepalived VRRP from VMnet11"

        counter drop
    }
    chain forward { type filter hook forward priority 0; policy drop; }
    chain output  { type filter hook output priority 0; policy accept; }
}
