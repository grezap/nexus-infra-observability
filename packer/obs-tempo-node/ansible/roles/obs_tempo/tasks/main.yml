---
# obs_tempo -- per-engine role for obs-tempo-node (Phase 0.I.3, ADR-0038).
# Installs Grafana Tempo from upstream release tar.gz (Go binary; no JVM).
# nexus-tempo.service is delivered DISABLED.

- name: Ensure tempo group
  ansible.builtin.group:
    name: tempo
    system: true
    state: present

- name: Ensure tempo user
  ansible.builtin.user:
    name: tempo
    group: tempo
    system: true
    shell: /usr/sbin/nologin
    home: /var/lib/nexus-tempo
    create_home: false
    state: present

- name: Download Tempo tarball
  ansible.builtin.get_url:
    url: "{{ obs_tempo_download_url }}"
    dest: "/tmp/tempo-{{ obs_tempo_version }}.tar.gz"
    mode: '0644'
    timeout: 180

- name: Create /opt/tempo
  ansible.builtin.file:
    path: /opt/tempo
    state: directory
    owner: tempo
    group: tempo
    mode: '0755'

- name: Extract Tempo
  ansible.builtin.unarchive:
    src: "/tmp/tempo-{{ obs_tempo_version }}.tar.gz"
    dest: /opt/tempo
    owner: tempo
    group: tempo
    remote_src: true
    creates: /opt/tempo/tempo

- name: Symlink tempo to /usr/local/bin
  ansible.builtin.file:
    src: /opt/tempo/tempo
    dest: /usr/local/bin/tempo
    state: link

- name: Mark tempo binary executable
  ansible.builtin.file:
    path: /opt/tempo/tempo
    mode: '0755'

- name: Create /etc/nexus-tempo + /var/lib/nexus-tempo
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: /etc/nexus-tempo, owner: root, group: tempo, mode: '0750' }
    - { path: /etc/nexus-tempo/tls, owner: root, group: tempo, mode: '0750' }
    - { path: /var/lib/nexus-tempo, owner: tempo, group: tempo, mode: '0755' }
    - { path: /var/lib/nexus-tempo/wal, owner: tempo, group: tempo, mode: '0755' }
    - { path: /var/lib/nexus-tempo/blocks, owner: tempo, group: tempo, mode: '0755' }
    - { path: /var/lib/nexus-tempo/generator-wal, owner: tempo, group: tempo, mode: '0755' }

- name: Drop placeholder tempo.yaml (overwritten by TF overlay at apply)
  ansible.builtin.copy:
    src: tempo.yaml
    dest: /etc/nexus-tempo/tempo.yaml
    owner: root
    group: tempo
    mode: '0640'

- name: Install nexus-tempo.service systemd unit
  ansible.builtin.copy:
    src: nexus-tempo.service
    dest: /etc/systemd/system/nexus-tempo.service
    owner: root
    group: root
    mode: '0644'

- name: Reload systemd + ensure nexus-tempo DISABLED at bake
  ansible.builtin.systemd:
    name: nexus-tempo.service
    enabled: false
    state: stopped
    daemon_reload: true

- name: Remove downloaded tarball
  ansible.builtin.file:
    path: "/tmp/tempo-{{ obs_tempo_version }}.tar.gz"
    state: absent
