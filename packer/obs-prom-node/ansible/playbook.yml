---
# obs-prom-node -- Ansible playbook (local, Packer ansible-local).
# Per-engine template: Prometheus + Alertmanager (Phase 0.I.1, ADR-0038).

- name: Configure obs-prom-node template (Phase 0.I.1)
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  vars:
    target_user: "{{ target_user | default('nexusadmin') }}"
    obs_prometheus_version: "{{ obs_prometheus_version | default('2.55.1') }}"
    obs_prometheus_download_url: >-
      {{ obs_prometheus_download_url |
         default('https://github.com/prometheus/prometheus/releases/download/v2.55.1/prometheus-2.55.1.linux-amd64.tar.gz') }}
    obs_alertmanager_version: "{{ obs_alertmanager_version | default('0.28.0') }}"
    obs_alertmanager_download_url: >-
      {{ obs_alertmanager_download_url |
         default('https://github.com/prometheus/alertmanager/releases/download/v0.28.0/alertmanager-0.28.0.linux-amd64.tar.gz') }}

  roles:
    - nexus_identity
    - nexus_network
    - nexus_firewall
    - nexus_observability
    - observability_firstboot
    - obs_prom
