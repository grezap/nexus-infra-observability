#!/usr/sbin/nft -f
#
# lakehouse-zookeeper-node -- nftables ruleset (Phase 0.L.3 baseline; cold-clone
# safety net). The TF role-overlay-spark-nftables-backplane.tf is canon.
#
# ZooKeeper is backplane-only: the client port (2181) and the quorum ports
# (2888 follower<->leader, 3888 leader election) are reached ONLY over the
# VMnet10 backplane -- the single "iifname nic1 192.168.10.0/24 accept" rule
# covers all of them (network segmentation is the coordination-layer security
# boundary, ADR-0035). VMnet11 exposes only SSH + node_exporter.

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority 0; policy drop;

        iif "lo" accept
        ct state { established, related } accept
        ct state invalid drop
        ip protocol icmp   accept
        ip6 nexthdr icmpv6 accept

        iifname "nic0" ip saddr 192.168.70.0/24 tcp dport 22   accept comment "SSH from VMnet11"
        iifname "nic0" ip saddr 192.168.70.0/24 tcp dport 9100 accept comment "node_exporter from VMnet11"
        iifname "nic1" ip saddr 192.168.10.0/24 accept comment "trusted cluster backplane (VMnet10) -- ZK client 2181 + quorum 2888/3888"

        counter drop
    }
    chain forward { type filter hook forward priority 0; policy drop; }
    chain output  { type filter hook output priority 0; policy accept; }
}
